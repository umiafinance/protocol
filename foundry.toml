[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via-ir = true
optimizer = true
optimizer_runs = 200
auto_detect_solc = true
ignored_warnings_from = ["lib/"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# This array is the authoritative remapping list. `remappings.txt` must stay a byte-for-byte mirror of
# it (entries only — Foundry's remappings.txt parser has NO comment syntax, so a `#` line there is a
# hard config error, not a note). That file exists purely for tooling that reads it but not this one
# (editor Solidity extensions, Slither, other standalone analysers). Foundry MERGES both lists, so an
# entry present in only one of them still silently joins the build — which is how the file once
# supplied `v4-periphery/` while omitting the `forge-std/` and `ds-test/` pins the build needs. Add
# new remappings here first, then mirror them.
#
# Do NOT regenerate `remappings.txt` with `forge remappings`. That command also prints the per-context
# remappings Foundry auto-detects for each vendored library, and writing them to a file promotes them
# to global scope. Among them is `test/=lib/continuous-clearing-auction/test/`, which would shadow this
# repository's own `test/` directory.

remappings = [
    # Pin the test harness globally. Several vendored libraries carry their own nested forge-std /
    # ds-test copies; with those submodules populated, Foundry's per-context auto-detection resolves
    # `forge-std/` to a different copy depending on which library a file lives in, and any contract
    # that ends up inheriting two of them fails to compile with "Identifier already declared". An
    # explicit global remapping collapses every copy onto the one revision this repo pins.
    'forge-std/=lib/forge-std/src/',
    'ds-test/=lib/forge-std/lib/ds-test/src/',
    '@openzeppelin/=lib/openzeppelin-contracts/',
    '@solady=lib/solady/src/',
    '@liquidity-launcher/=lib/liquidity-launcher/src/',
    '@continuous-clearing-auction=lib/continuous-clearing-auction/src/',
    '@uniswap/v4-core=lib/v4-core/',
    '@uniswap/v4-periphery=lib/v4-periphery/',
    # v4-periphery's own sources import siblings as `v4-periphery/...`. This entry used to live only in
    # `remappings.txt`, which meant the build depended on a file that had drifted out of sync with this
    # array; it is declared here so one list is authoritative.
    'v4-periphery/=lib/v4-periphery/',
    '@uniswap/permit2=lib/v4-periphery/lib/permit2/',
    '@blocknumberish/=lib/continuous-clearing-auction/lib/blocknumberish/',
    '@metavest/=lib/metavest/src/',
    # CCA imports 'liquidity-launcher/src/...'. Without this, auto-detection resolves the
    # prefix to lib/liquidity-launcher/src/ and the paths double up. Same pinned commit as
    # CCA's own nested copy, so this resolves to identical sources.
    'liquidity-launcher/=lib/liquidity-launcher/',
    # Universal Router, deployed by DeployV4Infra on chains Uniswap has not shipped
    # v4 to (Monad testnet). Pinned to 2.1.1, the version already deployed on Base
    # and Sepolia: it builds against the v4 and permit2 we already vendor, so the
    # remappings below redirect its nested copies of those. Only the V4 + Permit2
    # command paths are reachable, but the V2/V3 and v3->v4 migrator modules still
    # import interfaces from v2-core, v3-core and its own nested v3-periphery.
    # Those are all pragma >=0.5.0, so they compile here.
    'permit2/=lib/v4-periphery/lib/permit2/',
    'solmate/=lib/v4-core/lib/solmate/',
    '@uniswap/v2-core/=lib/v2-core/',
    '@uniswap/v3-core/=lib/v3-core/',
    '@uniswap/v3-periphery/=lib/universal-router/lib/v3-periphery/',
    '@uniswap/universal-router/=lib/universal-router/',
]

[lint]
ignore = ["test/**/*.sol", "script/**/*.sol"]
exclude_lints = ["block-timestamp", "incorrect-shift", "divide-before-multiply", "unsafe-typecast"]
